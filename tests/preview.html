<!DOCTYPE html>
<html lang="zh-CN">
<!--
  视觉验证页：在浏览器里直接打开即可（无需 ComfyUI）。

  它复用 web/styles/yue2.css 的真实样式和 renderResult() 的渲染结构，
  渲染一个短输出块和一个长输出块，用来肉眼确认两件事：

    1. .yue2-copy 的「复制」二字确实可见、可点；
    2. 长输出默认折叠，点「展开全文」后内容完整展开、不被裁剪。

  截图方式（Windows，无需安装额外依赖）：
    msedge --headless=new --window-size=760,1100 --screenshot out.png preview.html
-->
<head>
<meta charset="utf-8">
<title>YuE2 工作台输出区 — 视觉验证</title>
<link rel="stylesheet" href="../web/styles/yue2.css">
<style>
  /* Stand in for ComfyUI's own global button reset, which is what swallowed
     the copy label in the real UI. A bare `button` reset with no colour is the
     hostile case the extension has to survive. */
  body { margin: 0; background: #eceef3; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  button { font-family: inherit; }
  .harness { padding: 20px; display: flex; flex-direction: column; gap: 16px; max-width: 620px; }
  .harness > h1 { font-size: 15px; margin: 0 0 4px; color: #1f1f24; }
  .harness-note { font-size: 12px; color: #6b6b76; margin: 0 0 8px; }
  .yue2-column { border: 1px dashed #b9bce0; border-radius: 10px; padding: 12px; background: #fff; }
</style>
</head>
<body>
<div class="harness">
  <h1>输出区视觉验证</h1>
  <p class="harness-note">下面的区块由页面脚本按 <code>web/main.js</code> 的渲染逻辑生成，直接复用真实 CSS。</p>
  <div class="yue2-column" id="outputs"></div>
</div>
<script>
// Mirror of renderResult()'s structure: every block collapses the same way and
// starts collapsed. One short and one long payload, so the screenshot shows
// that a short block collapses too (rather than only long ones).
const OUTPUTS = [
  { key: "short", title: "① Style 提示词" },
  { key: "long", title: "⑤ YuE2 JSON" },
];
const SHORT = "City Pop, Mandarin, female lead vocal, groovy bass, electric guitar, Rhodes piano, tight drums";
const LONG = JSON.stringify({
  genre: "City Pop",
  language: "Mandarin",
  vocal: "female lead vocal",
  section: Array.from({ length: 14 }, (_, i) => `段落 ${i + 1}：夜晚的霓虹映在湿漉漉的街面上，回声一层层散开`),
  production: "glossy 80s production, gated reverb, analog chorus",
}, null, 2);

const container = document.getElementById("outputs");
for (const output of OUTPUTS) {
  const value = output.key === "short" ? SHORT : LONG;
  const block = document.createElement("div");
  block.className = "yue2-output";
  block.dataset.collapsed = "true";
  block.innerHTML = `
    <div class="yue2-output-head" role="button" tabindex="0" aria-expanded="false">
      <span class="yue2-chevron" aria-hidden="true"></span>
      <h4>${output.title}</h4>
      <span class="yue2-spacer"></span>
      <button type="button" class="yue2-toggle" data-expanded="false">展开</button>
      <button type="button" class="yue2-copy">复制</button>
    </div>
    <pre></pre>`;
  block.querySelector("pre").textContent = value;

  const head = block.querySelector(".yue2-output-head");
  const toggleButton = block.querySelector(".yue2-toggle");
  const setExpanded = (next) => {
    if (next) delete block.dataset.collapsed;
    else block.dataset.collapsed = "true";
    toggleButton.textContent = next ? "收起" : "展开";
    toggleButton.dataset.expanded = String(next);
    head.setAttribute("aria-expanded", String(next));
  };
  toggleButton.addEventListener("click", (e) => {
    e.stopPropagation();
    setExpanded(block.dataset.collapsed === "true");
  });
  head.addEventListener("click", (e) => {
    if (e.target.closest(".yue2-copy")) return;
    setExpanded(block.dataset.collapsed === "true");
  });

  const copyButton = block.querySelector(".yue2-copy");
  copyButton.addEventListener("click", () => {
    copyButton.textContent = "已复制";
    copyButton.dataset.copied = "true";
    setTimeout(() => {
      copyButton.textContent = "复制";
      delete copyButton.dataset.copied;
    }, 1500);
  });
  container.appendChild(block);
}

// Expand both so the screenshot captures the collapsed list AND the expanded
// body in one frame: the long JSON proves nothing is clipped, the short one
// proves a short block expands too.
requestAnimationFrame(() => {
  for (const block of container.querySelectorAll(".yue2-output")) {
    block.querySelector(".yue2-toggle").click();
  }
  const pre = container.querySelector("pre");
  requestAnimationFrame(() => {
    document.querySelector("h1").textContent =
      `展开态 — 长块 ${LONG.length} 字符，pre 可视 ${Math.round(pre.getBoundingClientRect().height)}px / 滚动 ${pre.scrollHeight}px，完整 = ${pre.scrollHeight <= pre.getBoundingClientRect().height + 1}`;
  });
});
</script>
</body>
</html>
